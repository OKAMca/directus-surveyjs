name: Publishing

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish Package
        # A GitHub pre-release publishes under the `next` dist-tag, so `latest` stays on stable versions.
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
